name: rental_test
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  google_fonts: ^6.3.2
  flutter_native_splash: ^2.4.7
  flutter_svg: ^2.2.1
  table_calendar: ^3.2.0
  intl: ^0.20.2


dev_dependencies:
  flutter_test:
    sdk: flutter
    
  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

flutter_native_splash:
  color: "#FFFFFF" # background color
  image: assets/images/logo-splashscreen.png # logo tengah

  android_12:
    image: assets/images/logo-splashscreen.png
    icon_background_color: "#FFFFFF"

  web: false